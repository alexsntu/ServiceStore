<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ company_name }}: Message title</title>
  <style type="text/css">
    #outlook a { padding: 0; }

    body {
      width: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      margin: 0;
      padding: 0;
      background-color: #f5f5f7;
    }

    img {
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
    }

    a { outline: none; }
    a img { border: none; }
    .image_fix { display: block; }

    /* ── Хедер ── */
    .message-header > td {
      padding: 0;
      background-color: #ffffff;
    }

    /* ── Заголовок письма ── */
    .message-header__title {
      background-color: #f5f5f7;
    }
    .message-header__title > td {
      padding: 20px 32px 20px 32px;
    }
    .message-header__title h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1d1d1f;
      text-transform: none;
      letter-spacing: -0.02em;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* ── Тело ── */
    .message-title > td,
    .message-body > td {
      padding: 30px 32px;
    }

    /* ── Старые классы футера — переопределены в email-footer.html ── */
    .message-footer > td {
      padding: 0;
    }
    .message-copyright > td {
      padding: 0;
    }

    /* ── Типографика ── */
    .message-header td,
    .message-title td,
    .message-body th, .message-body td,
    .message-footer th, .message-footer td,
    .message-copyright th, .message-copyright td {
      color: {{styles.font}};
      font-size: {{styles.body_font_size}};
      font-family: {{styles.body_font}}, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    .message-body table th,
    .message-footer table th {
      text-transform: uppercase;
      border-bottom: 1px solid {{styles.base}};
      text-align: left;
    }
    .message-body table td,
    .message-footer table td {
      padding: 5px;
    }

    .with-subline {
      color: {{styles.font}};
      text-transform: uppercase;
      font-weight: bold;
      font-size: 1em;
      padding-bottom: 10px;
      border-bottom: 1px solid #D4D4D4;
    }

    p { margin: 1em 0; }

    h1,h2,h3,h4,h5,h6 { color: {{styles.font}}; }
    h1 a,h2 a,h3 a,h4 a,h5 a,h6 a { color: {{styles.links}}; }

    table td, table th { border-collapse: collapse; }
    table {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    address { margin: 0; }

    .content-wrapper {
      border: 1px solid #e0e0e5;
      background-color: #ffffff;
      border-radius: 0;
    }

    .copyright td {
      padding: 10px 0 0 0;
      padding-bottom: 0 !important;
    }

    a { color: {{styles.links}}; }

    .email-preview {
      display: none;
      font-size: 1px;
      color: #f5f5f7;
      line-height: 1px;
      max-height: 0;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
    }

    {% if language_direction == "rtl" %}
    .ty-email-footer { text-align: center !important; }
    .ty-email-footer-social-buttons { text-align: center !important; }
    .ty-email-footer-right-part { text-align: center !important; float: left !important; }
    .ty-email-footer-left-part { text-align: center !important; float: right !important; }
    {% endif %}
  </style>
</head>

<body>
  <style>
    @media only screen and (max-device-width: 480px) {
      .content-wrapper { width: 100% !important; }
      .message-header > td,
      .message-title > td,
      .message-body > td,
      .message-footer > td,
      .message-copyright > td { padding: 12px !important; }
      .message-header td,
      .message-title td,
      .message-body th, .message-body td,
      .message-footer th, .message-footer td,
      .message-copyright th, .message-copyright td { font-size: 16px !important; }
    }
  </style>

  <!--[if gte mso 9]><style>/* Outlook 2007+ */</style><![endif]-->

  <!-- Внешняя обёртка — светло-серый Apple фон -->
  <table class="main-wrapper" cellpadding="0" cellspacing="0" width="100%"
         style="background-color: #f5f5f7;" dir="{{ language_direction }}">
    <tr>
      <td style="padding: 32px 10px 0 10px;">

        <!-- Карточка письма 600px -->
        <table class="content-wrapper" cellpadding="0" cellspacing="0" align="center" width="600"
               style="border-radius: 16px 16px 0 0; overflow: hidden; border: 1px solid #e0e0e5; border-bottom: none;">

          <!-- ─── HEADER: логотип ─── -->
          <tr class="message-header">
            <td style="padding: 0; background-color: #ffffff;">

              <!-- Белая полоска с логотипом -->
              <table width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="padding: 24px 32px 22px 32px; background-color: #ffffff; vertical-align: middle;">
                    <a href="{{ storefront_data.url }}" style="display: inline-block; text-decoration: none;">
                      <!-- Логотип: height убран — растягивания не будет, ширина ограничена -->
                      <img src="{{logos.mail.image.image_path}}"
                           alt="{{ company_data.company_name }}"
                           style="display: block; height: auto; max-height: 52px; width: auto; max-width: 220px; border: 0;" />
                    </a>
                  </td>
                  <td style="padding: 24px 32px 22px 0; vertical-align: middle; text-align: right;">
                    <span style="font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; color: #86868b;">
                      irepair-store.ru
                    </span>
                  </td>
                </tr>
              </table>

              <!-- Синяя акцент-полоска снизу хедера -->
              <table width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="height: 3px; background-color: #0071e3; font-size: 0; line-height: 0;">&nbsp;</td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- ─── Заголовок письма (тема) ─── -->
          {% if title %}
          <tr class="message-header__title">
            <td style="padding: 22px 32px 18px 32px; background-color: #f5f5f7; border-bottom: 1px solid #e0e0e5;">
              <h1 style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; color: #1d1d1f; letter-spacing: -0.02em; text-transform: none;">
                {{ title }}
              </h1>
            </td>
          </tr>
          {% endif %}

          <!-- ─── ТЕЛО ПИСЬМА ─── -->
          <tr class="message-body">
            <td style="background-color: #ffffff;">
